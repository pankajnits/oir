[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oir-layer"
version = "1.0.6"
description = "Opaque isomorphic reasoning: a measurement protocol plus an HMAC middle layer. Seals hide lexicon; they are not confidentiality."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Pankaj Pandey", email = "mightypp.nits@gmail.com"}]
keywords = ["llm", "hmac", "multi-hop", "opaque-identifiers", "measurement"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Typing :: Typed",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
cursor = ["cursor-sdk"]
excel = ["openpyxl>=3.1"]
paper = ["matplotlib>=3.8", "numpy>=1.24"]
dev = ["pytest>=7", "ruff>=0.6"]
torch = ["torch"]

[project.urls]
Homepage = "https://github.com/pankajnits/oir"
Repository = "https://github.com/pankajnits/oir"
Issues = "https://github.com/pankajnits/oir/issues"
Paper = "https://github.com/pankajnits/oir/blob/v1.0.6/paper/arxiv_upload/main.pdf"
Scientists = "https://github.com/pankajnits/oir/blob/v1.0.6/SCIENTIST.md"

[tool.setuptools.packages.find]
include = ["oir*"]
exclude = ["harness*", "paper*", "runs*", "results*", "tests*", "examples*", "tools*"]

[tool.setuptools.package-data]
oir = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["oir", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
